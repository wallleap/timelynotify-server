style: github
template: CHANGELOG.tpl.md
info:
  title: CHANGELOG
  repository_url: https://github.com/wallleap/timelynotify-server
options:
  commits:
    filters:
      Type:
        - feat
        - fix
        - build
        - test
        - chore
        - docs
  commit_groups:
    title_maps:
      feat: Features
      fix: Bug Fixes
      build: Build
      test: Tests
      chore: Maintenance
      docs: Documentation
  header:
    pattern: "^(\\w*)(?:\\(([\\w\\$\\.\\-\\*\\s]*)\\))?\\:\\s(.*)$"
    pattern_maps:
      - Type
      - Scope
      - Subject
  notes:
    keywords:
      - BREAKING CHANGE
